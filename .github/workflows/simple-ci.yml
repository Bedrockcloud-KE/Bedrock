name: Simple CI

on:
  push:
    branches: ["rebrand-bedrock"]
  pull_request:
    branches: ["rebrand-bedrock"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test --if-present
      
      - name: Build (without Docker)
        run: npm run build --if-present

