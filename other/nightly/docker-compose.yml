services:
    bedrock:
        container_name: bedrock
        restart: always
        working_dir: /var/www/html
        extra_hosts:
            - host.docker.internal:host-gateway
        networks:
            - bedrock
        depends_on:
            - postgres
            - redis
            - soketi
    postgres:
        image: postgres:15-alpine
        container_name: bedrock-db
        restart: always
        networks:
            - bedrock
    redis:
        image: redis:7-alpine
        container_name: bedrock-redis
        restart: always
        networks:
            - bedrock
    soketi:
        container_name: bedrock-realtime
        extra_hosts:
            - host.docker.internal:host-gateway
        restart: always
        networks:
            - bedrock
networks:
    bedrock:
        name: bedrock
        driver: bridge
        external: false
